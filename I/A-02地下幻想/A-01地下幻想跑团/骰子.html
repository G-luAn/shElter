<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>暗影骰子 | 罗马数字占卜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #1a0a0a, #050101);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinema', 'Times New Roman', 'Cormorant Garamond', serif;
            padding: 1.5rem;
            position: relative;
        }

        /* 极简神秘背景纹路（不干扰文字，仅为装饰） */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 10% 20%, rgba(100, 20, 20, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        /* 主容器——暗黑祭坛风格，但无多余文字 */
        .dice-shrine {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }

        /* 骰子核心 - 红黑奥秘之面 */
        .dice-core {
            width: 280px;
            height: 280px;
            background: radial-gradient(ellipse at 35% 30%, #2d1111, #0a0202);
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.7), inset 0 1px 2px rgba(220, 60, 60, 0.4), 0 0 0 3px #631212, 0 0 0 8px rgba(20,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s;
            position: relative;
        }

        /* 神秘光晕环 */
        .dice-core::after {
            content: "";
            position: absolute;
            top: -12px;
            left: -12px;
            right: -12px;
            bottom: -12px;
            border-radius: 60px;
            background: radial-gradient(circle, rgba(150,30,30,0.2) 0%, rgba(80,0,0,0) 80%);
            pointer-events: none;
            z-index: -1;
            animation: slowPulse 5s infinite alternate;
        }

        @keyframes slowPulse {
            0% { opacity: 0.3; transform: scale(0.96);}
            100% { opacity: 0.9; transform: scale(1.06);}
        }

        .dice-core:active {
            transform: scale(0.97);
            box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,70,70,0.3);
        }

        /* 罗马数字显示区 */
        .roman-number {
            font-size: 5.2rem;
            font-weight: 600;
            color: #e6bfa5;
            text-shadow: 0 0 8px #b32b2b, 0 2px 5px #2c0000;
            letter-spacing: 4px;
            font-family: 'Times New Roman', 'Georgia', 'Cinema', serif;
            background: rgba(0,0,0,0.3);
            padding: 0.2em 0.5em;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            transition: all 0.1s;
        }

        /* 掷骰仪式按钮 (极简，仅图标风) */
        .roll-trigger {
            background: linear-gradient(135deg, #281010, #0c0303);
            border: 1px solid #9e3a3a;
            padding: 14px 32px;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 6px;
            color: #dc9a7a;
            text-transform: uppercase;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 7px 0 #3f0f0f;
            font-family: monospace;
            backdrop-filter: blur(2px);
            width: auto;
            min-width: 200px;
            text-align: center;
        }

        .roll-trigger:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #3f0f0f;
        }

        .roll-trigger:hover {
            background: linear-gradient(135deg, #3c1818, #150404);
            color: #ffcfb0;
            border-color: #c75454;
            letter-spacing: 8px;
        }

        /* 底部极简符文装饰 (非文字，仅为视觉) */
        .sigil-marks {
            display: flex;
            gap: 20px;
            margin-top: 0.5rem;
            justify-content: center;
            opacity: 0.5;
        }
        .sigil-marks div {
            width: 24px;
            height: 2px;
            background: #a03f3f;
            border-radius: 2px;
            box-shadow: 0 0 4px #a33;
        }
        .sigil-marks div:nth-child(odd) {
            width: 36px;
        }

        /* 响应式 */
        @media (max-width: 500px) {
            .dice-core {
                width: 240px;
                height: 240px;
                border-radius: 40px;
            }
            .roman-number {
                font-size: 4rem;
            }
            .roll-trigger {
                font-size: 1.2rem;
                padding: 12px 24px;
                letter-spacing: 4px;
            }
        }
        @media (max-width: 380px) {
            .dice-core {
                width: 200px;
                height: 200px;
            }
            .roman-number {
                font-size: 3.2rem;
            }
        }

        /* 掷骰动画 (闪烁翻转感) */
        .rolling-animation {
            animation: diceShake 0.2s cubic-bezier(0.4, 1.2, 0.8, 1) 0s 3 alternate, flickerGlow 0.08s step-start 0s 8;
        }
        @keyframes diceShake {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            25% { transform: translate(-6px, 4px) rotate(-8deg); }
            75% { transform: translate(6px, -3px) rotate(8deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        @keyframes flickerGlow {
            0% { text-shadow: 0 0 2px #e66, 0 0 6px #b33; filter: brightness(1);}
            50% { text-shadow: 0 0 18px #ff5555, 0 0 25px #a00; filter: brightness(1.2);}
            100% { text-shadow: 0 0 2px #e66, 0 0 6px #b33; filter: brightness(1);}
        }
    </style>
</head>
<body>

<div class="dice-shrine">
    <!-- 骰子圣所核心：展示罗马数字 -->
    <div class="dice-core" id="diceCore">
        <div class="roman-number" id="romanValue">XIII</div>
    </div>
    
    <!-- 掷骰行动钮，简洁无多余文字（符号化） -->
    <button class="roll-trigger" id="rollButton">⚡ 掷 骰 ⚡</button>
    
    <!-- 极简抽象装饰，无任何文本含义 -->
    <div class="sigil-marks">
        <div></div>
        <div></div>
        <div></div>
    </div>
</div>

<script>
    (function(){
        // 罗马数字转换器 (1 到 20)
        function toRoman(num) {
            const romanMap = [
                [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], 
                [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]
            ];
            // 但需求只到20，更简单精准
            const exactRomans = {
                1: "I", 2: "II", 3: "III", 4: "IV", 5: "V",
                6: "VI", 7: "VII", 8: "VIII", 9: "IX", 10: "X",
                11: "XI", 12: "XII", 13: "XIII", 14: "XIV", 15: "XV",
                16: "XVI", 17: "XVII", 18: "XVIII", 19: "XIX", 20: "XX"
            };
            return exactRomans[num] || "?";
        }
        
        // DOM 元素
        const romanDisplay = document.getElementById('romanValue');
        const diceCore = document.getElementById('diceCore');
        const rollBtn = document.getElementById('rollButton');
        
        let isRolling = false;
        let currentValue = 13;   // 初始 XIII
        
        // 更新显示 (无额外文字)
        function updateDisplay(value) {
            const romanStr = toRoman(value);
            romanDisplay.textContent = romanStr;
            currentValue = value;
        }
        
        // 随机掷骰 1-20
        function getRandomD20() {
            return Math.floor(Math.random() * 20) + 1;
        }
        
        // 动画掷骰过程 (快速变换数字模拟骰子滚动)
        function rollWithAnimation() {
            if (isRolling) return;
            isRolling = true;
            
            // 禁用按钮短暂期间
            rollBtn.disabled = true;
            diceCore.style.pointerEvents = 'none';
            
            // 添加动画类到骰子核心 (震动+闪烁)
            diceCore.classList.add('rolling-animation');
            
            const rollDuration = 350; // 动画总时长 (ms)
            const intervalTime = 45;   // 每45ms变换一次数字
            let elapsed = 0;
            let timer = null;
            
            // 最终点数 (生成)
            const finalNumber = getRandomD20();
            
            // 动画切换随机中间值
            const intervalId = setInterval(() => {
                // 展示随机罗马数字 (1-20)
                const tempVal = getRandomD20();
                romanDisplay.textContent = toRoman(tempVal);
                elapsed += intervalTime;
                if (elapsed >= rollDuration) {
                    clearInterval(intervalId);
                    // 显示最终数字
                    romanDisplay.textContent = toRoman(finalNumber);
                    currentValue = finalNumber;
                    // 移除动画class
                    diceCore.classList.remove('rolling-animation');
                    // 恢复交互
                    rollBtn.disabled = false;
                    diceCore.style.pointerEvents = 'auto';
                    isRolling = false;
                    // 附加一个微小的最终光晕脉冲效果 (不影响文字)
                    diceCore.style.transform = "scale(1.02)";
                    setTimeout(() => { if(diceCore) diceCore.style.transform = ""; }, 120);
                }
            }, intervalTime);
        }
        
        // 通过点击骰子核心也能掷骰
        function handleRoll() {
            if (isRolling) return;
            rollWithAnimation();
        }
        
        // 绑定事件
        rollBtn.addEventListener('click', handleRoll);
        diceCore.addEventListener('click', handleRoll);
        
        // 初始显示默认罗马数字 (XIII 13，神秘象征)
        updateDisplay(13);
        
        // 可选：防止触摸时页面缩放导致的闪动 (无文字)
    })();
</script>
</body>
</html>
